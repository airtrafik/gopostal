name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache libpostal
        id: cache-libpostal
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/libpostal*
            /usr/local/include/libpostal
            /usr/local/lib/pkgconfig/libpostal.pc
          key: libpostal-${{ runner.os }}-v1

      - name: Install libpostal
        if: steps.cache-libpostal.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y curl autoconf automake libtool pkg-config
          git clone https://github.com/openvenues/libpostal /tmp/libpostal
          cd /tmp/libpostal
          ./bootstrap.sh
          ./configure --disable-sse2 --disable-data-download
          make -j$(nproc)
          sudo make install

      - name: Update linker cache
        run: sudo ldconfig

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Run linting
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache libpostal
        id: cache-libpostal
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/libpostal*
            /usr/local/include/libpostal
            /usr/local/lib/pkgconfig/libpostal.pc
            /tmp/libpostal-data
          key: libpostal-withdata-${{ runner.os }}-v1

      - name: Install libpostal
        if: steps.cache-libpostal.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y curl autoconf automake libtool pkg-config
          git clone https://github.com/openvenues/libpostal /tmp/libpostal
          cd /tmp/libpostal
          ./bootstrap.sh
          ./configure --datadir=/tmp/libpostal-data --disable-sse2
          make -j$(nproc)
          sudo make install

      - name: Update linker cache
        run: sudo ldconfig

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Run tests
        env:
          LIBPOSTAL_DATA_DIR: /tmp/libpostal-data
        run: make test
